schema = 1
name = "DailyWave"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"
workspace = "frontend"

[[setup.steps]]
kind = "dependencies"
working_directory = "frontend"
locked = true

[[setup.steps]]
run = ["npm", "run", "build"]
working_directory = "frontend"

[launch]
working_directory = "frontend"
command = ["npm", "run", "preview", "--", "--host", "{host}", "--port", "{port}", "--strictPort"]
host = "127.0.0.1"
port = 3000

[health]
type = "http"
path = "/"
timeout_seconds = 90

# Browser storage is scoped to the browser profile and origin, outside this checkout.
[persistence]
paths = []
